<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#075e54" />
  <meta name="description" content="Offline-first chat and voice sales management PWA" />
  <title>SalesChat Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="chat-header">
      <div class="brand">
        <div class="avatar">📊</div>
        <div class="brand-meta">
          <div class="title-row">
            <h1>SalesChat</h1>
            <button type="button" id="active-store-btn" class="store-pill" title="Tap to change active store">
              🏪 Set Store
            </button>
            <span id="sync-badge" class="sync-badge hidden" title="Pending offline records">0 queued</span>
          </div>
          <span id="connection-status" class="status">Online • Google Sheets</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Admin Dashboard Button (RBAC Controlled) -->
        <button type="button" id="dashboard-btn" class="icon-circle-btn admin-only" aria-label="Admin Dashboard" title="Admin Analytics Dashboard">
          📈
        </button>

        <!-- Role Switcher -->
        <select id="role-select" class="pill-select" aria-label="User Role">
          <option value="admin">Admin</option>
          <option value="sales">Sales</option>
        </select>

        <!-- User Switcher -->
        <select id="user-select" class="pill-select" aria-label="Active User">
          <option value="Vaibhav">Vaibhav</option>
          <option value="Aishwarya">Aishwarya</option>
          <option value="Salesperson 1">Sales 1</option>
        </select>

        <!-- Theme Toggle -->
        <button type="button" id="theme-toggle" class="icon-circle-btn" aria-label="Toggle Theme" title="Toggle Dark Mode">
          🌙
        </button>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <main id="chat-feed" class="chat-feed" aria-live="polite"></main>

    <!-- Dynamic Store Suggestions (Shown during Store Setup or Switching) -->
    <div id="shop-suggestions" class="shop-suggestions hidden" role="listbox" aria-label="Store suggestions"></div>

    <!-- Quick Action Command Strip -->
    <nav id="command-bar" class="command-bar" aria-label="Quick Commands">
      <button type="button" class="cmd-chip" data-cmd="Today's Total">Today's Total</button>
      <button type="button" class="cmd-chip admin-only" data-cmd="Summary">Summary</button>
      <button type="button" class="cmd-chip admin-only" data-cmd="Monthly Summary">Monthly Summary</button>
      <button type="button" class="cmd-chip" data-cmd="Total Medical">Total Medical</button>
      <button type="button" class="cmd-chip" data-cmd="Total Kirana">Total Kirana</button>
      <button type="button" class="cmd-chip" data-cmd="Sales Today Medical">Sales Today Medical</button>
    </nav>

    <!-- Chat Input Bar -->
    <footer class="chat-composer">
      <form id="composer-form" class="composer-form" novalidate>
        <input
          type="text"
          id="message-input"
          placeholder="Enter store name first..."
          autocomplete="off"
          enterkeyhint="send"
        />
        <button type="button" id="voice-btn" class="action-btn voice-btn" aria-label="Voice Input" title="Speak Store, Sale, or Command">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
        </button>
        <button type="submit" id="send-btn" class="action-btn send-btn" aria-label="Send Message" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Admin Analytics Dashboard Modal -->
  <div id="dashboard-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dash-title">
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h2 id="dash-title">Admin Analytics Dashboard</h2>
          <p class="modal-subtitle">Real-time sales intelligence & exports</p>
        </div>
        <div class="modal-actions">
          <button type="button" id="refresh-dash-btn" class="secondary-btn" title="Refresh Data">🔄</button>
          <button type="button" id="export-csv-btn" class="primary-btn">⬇ CSV</button>
          <button type="button" id="close-dash-btn" class="icon-close-btn" aria-label="Close Dashboard">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <div class="kpi-grid">
          <div class="kpi-card">
            <span class="kpi-label">Today's Sales</span>
            <strong id="kpi-today" class="kpi-value">₹0</strong>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">This Month</span>
            <strong id="kpi-month" class="kpi-value">₹0</strong>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Grand Total</span>
            <strong id="kpi-grand" class="kpi-value">₹0</strong>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Transactions</span>
            <strong id="kpi-count" class="kpi-value">0</strong>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-card">
            <h3>Shop-Wise Share</h3>
            <div class="chart-wrap">
              <canvas id="shop-chart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <h3>Monthly Revenue Trend</h3>
            <div class="chart-wrap">
              <canvas id="monthly-chart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
